<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartLife - Smart Dashboard, Transactions, Tasks & Health</title>
  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Manage your money, track your daily health goals, structure your todo lists, and stay notified with SmartLife dashboard.">
  <meta name="theme-color" content="#f2f7f7">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="smartlifePNG.png" type="image/png">

  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            themeBg: '#f2f7f7',
            themeSecondary: '#ffffff',
            themeTertiary: '#edf4f4',
            accentPurple: '#007a7a',
            accentBlue: '#0284c7',
            accentGreen: '#10b981',
            accentPink: '#f2994a',
            accentOrange: '#f2994a',
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css?v=8">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="antialiased min-h-screen text-slate-800 bg-[#f2f7f7]">
  <!-- Core SPA Mounting Point -->
  <div id="app" class="min-h-screen flex flex-col md:flex-row bg-[#f2f7f7]">
    <!-- Initial Skeleton UI (Replaced dynamically by JS) -->
    <!-- Sidebar Skeleton -->
    <aside
      class="fixed md:sticky top-0 left-0 right-0 md:h-screen z-40 w-full md:w-64 bg-[#007a7a] p-5 flex flex-col shrink-0 border-r border-white/10 hidden md:flex">
      <div class="flex items-center gap-3 mb-10">
        <div class="w-12 h-12 rounded-full bg-white/20 animate-pulse"></div>
        <div class="flex-1 space-y-2">
          <div class="h-4 bg-white/20 rounded w-3/4 animate-pulse"></div>
          <div class="h-3 bg-white/10 rounded w-1/2 animate-pulse"></div>
        </div>
      </div>
      <div class="space-y-4">
        <div class="h-10 bg-white/10 rounded-xl w-full animate-pulse"></div>
        <div class="h-10 bg-white/10 rounded-xl w-full animate-pulse"></div>
        <div class="h-10 bg-white/10 rounded-xl w-full animate-pulse"></div>
        <div class="h-10 bg-white/10 rounded-xl w-full animate-pulse"></div>
      </div>
    </aside>

    <!-- Main Content Skeleton -->
    <main class="flex-1 p-6 md:p-10 flex flex-col min-h-screen">
      <!-- Dashboard Skeleton -->
      <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-8">
        <div>
          <div class="h-8 w-64 bg-slate-200 rounded animate-pulse mb-2"></div>
          <div class="h-4 w-48 bg-slate-200 rounded animate-pulse"></div>
        </div>
        <div class="h-10 w-32 bg-slate-200 rounded-xl animate-pulse"></div>
      </div>

      <!-- Stat Cards -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div class="h-28 rounded-2xl bg-white shadow-sm border border-slate-100 animate-pulse"></div>
        <div class="h-28 rounded-2xl bg-white shadow-sm border border-slate-100 animate-pulse"></div>
        <div class="h-28 rounded-2xl bg-white shadow-sm border border-slate-100 animate-pulse"></div>
        <div class="h-28 rounded-2xl bg-white shadow-sm border border-slate-100 animate-pulse"></div>
      </div>

      <!-- Analysis Banner -->
      <div class="h-[60px] bg-white rounded-t-2xl shadow-sm border border-slate-100 animate-pulse mb-1"></div>

      <!-- Charts -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="h-[300px] rounded-3xl bg-white shadow-sm border border-slate-100 animate-pulse"></div>
        <div class="h-[300px] rounded-3xl bg-white shadow-sm border border-slate-100 animate-pulse"></div>
        <div class="h-[300px] rounded-3xl bg-white shadow-sm border border-slate-100 animate-pulse"></div>
      </div>
    </main>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

  <!-- Core Javascript driver -->
  <script type="module" src="app.js?v=5"></script>
</body>

</html>
