<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartLife - Smart Dashboard, Transactions, Tasks & Health</title>
  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Manage your money, track your daily health goals, structure your todo lists, and stay notified with SmartLife dashboard.">
  <meta name="theme-color" content="#f2f7f7">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="smartlifePNG.png" type="image/png">

  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            themeBg: '#f2f7f7',
            themeSecondary: '#ffffff',
            themeTertiary: '#edf4f4',
            accentPurple: '#007a7a',
            accentBlue: '#0284c7',
            accentGreen: '#10b981',
            accentPink: '#f2994a',
            accentOrange: '#f2994a',
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css?v=8">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="antialiased min-h-screen text-slate-800 bg-[#f2f7f7]">
  <div id="app" class="min-h-screen bg-slate-50 flex items-center justify-center">
    <!-- Initial Loading Spinner -->
    <div class="flex flex-col items-center gap-4">
      <div class="w-12 h-12 border-4 border-[#007a7a] border-t-transparent rounded-full animate-spin"></div>
      <p class="text-slate-500 font-medium animate-pulse">กำลังโหลดข้อมูล...</p>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

  <!-- Core Javascript driver -->
  <script type="module" src="app.js?v=5"></script>
</body>

</html>
