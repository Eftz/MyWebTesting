<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartLife - Smart Dashboard, Transactions, Tasks & Health</title>
  <!-- SEO Meta Tags -->
  <meta name="description" content="Manage your money, track your daily health goals, structure your todo lists, and stay notified with SmartLife dashboard.">
  <meta name="theme-color" content="#0a0715">
  
  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            themeBg: '#0a0715',
            themeSecondary: '#120e26',
            themeTertiary: '#191435',
            accentPurple: '#9333ea',
            accentBlue: '#06b6d4',
            accentGreen: '#10b981',
            accentPink: '#ec4899',
            accentOrange: '#f97316',
          }
        }
      }
    }
  </script>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="antialiased min-h-screen text-slate-100 bg-[#0a0715]">
  <!-- Core SPA Mounting Point -->
  <div id="app" class="min-h-screen flex flex-col justify-between">
    <!-- Rendered dynamically by app.js -->
    <div class="flex items-center justify-center min-h-screen">
      <div class="flex flex-col items-center gap-4">
        <!-- Gorgeous Loading Spinner -->
        <div class="relative w-16 h-16">
          <div class="absolute inset-0 rounded-full border-4 border-purple-500/20"></div>
          <div class="absolute inset-0 rounded-full border-4 border-purple-600 border-t-transparent animate-spin"></div>
        </div>
        <p class="text-slate-400 text-sm font-semibold tracking-wider animate-pulse">LOADING SMARTLIFE...</p>
      </div>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

  <!-- Core Javascript driver -->
  <script type="module" src="app.js"></script>
</body>
</html>
